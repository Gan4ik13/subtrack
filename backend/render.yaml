services:
  - type: web
    name: subtrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PAYMENT_MODE
        value: yoomoney
      - key: PRICE_RUB
        value: "15"
      - key: DATABASE_URL
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: YOOMONEY_WALLET
        sync: false
      - key: YOOMONEY_TOKEN
        sync: false
      - key: YOOMONEY_NOTIFY_SECRET
        sync: false
